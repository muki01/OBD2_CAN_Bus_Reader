name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can. The debug output is the most helpful part.
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - WebServer_Code_CAN
        - Basic_Code
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: e.g. ESP32-S3 DevKitC-1, Arduino Nano
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: CAN transceiver
      options:
        - TJA1050
        - SN65HVD230
        - Other / custom PCB
    validations:
      required: true
  - type: input
    id: vehicle
    attributes:
      label: Vehicle
      placeholder: Make, model, year and engine
  - type: dropdown
    id: protocol
    attributes:
      label: Selected protocol
      options:
        - Automatic
        - 11b250
        - 29b250
        - 11b500
        - 29b500
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Debug output
      description: Enable `DEBUG_Serial` and paste the log. Remove your VIN if you prefer.
      render: text
