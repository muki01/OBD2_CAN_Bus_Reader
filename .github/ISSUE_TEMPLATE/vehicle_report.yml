name: 🚗 Vehicle report
description: Tell us whether OBD2 CAN Bus Reader works with your car
title: "[Vehicle] <make> <model> <year>"
labels: ["vehicle-report"]
body:
  - type: markdown
    attributes:
      value: |
        Real-world test reports help everyone find out whether their car is supported. Thank you! 🙌
  - type: input
    id: vehicle
    attributes:
      label: Vehicle
      placeholder: Make, model, year
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine / ECU
      placeholder: e.g. 1.6 petrol, Bosch ME7.5
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - ✅ Works
        - ⚠️ Partially works
        - ❌ Does not connect
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Detected protocol
      options:
        - 11 bit, 250 kbit/s
        - 29 bit, 250 kbit/s
        - 11 bit, 500 kbit/s
        - 29 bit, 500 kbit/s
        - Not detected
    validations:
      required: true
  - type: checkboxes
    id: features
    attributes:
      label: Working features
      options:
        - label: Live data
        - label: Read DTCs
        - label: Clear DTCs
        - label: Freeze frame
        - label: VIN / vehicle info
  - type: input
    id: hardware
    attributes:
      label: Board and interface
      placeholder: e.g. ESP32-S3 + TJA1050
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else worth knowing (quirks, timing tweaks, logs).
